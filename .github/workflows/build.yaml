name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - run: cargo test --release
      - run: cargo build --release
      - run: cp target/release/macbench macbench-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: macbench-macos-arm64
          path: macbench-macos-arm64

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" macbench-macos-arm64 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
