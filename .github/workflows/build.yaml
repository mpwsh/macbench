name: release

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  macos-arm64:
    # Only for v* releases (manual runs build without publishing)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest # Apple Silicon
    env:
      BIN: ${{ github.event.repository.name }}-arm64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          cp target/release/${{ github.event.repository.name }} "$BIN"
          shasum -a 256 "$BIN" | cut -d ' ' -f 1 > "$BIN.sha256"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BIN }}
            ${{ env.BIN }}.sha256

      - name: Upload as artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}
          path: |
            ${{ env.BIN }}
            ${{ env.BIN }}.sha256
